[build]
  command = "pnpm build"
  publish = "dist"

# Do NOT enable pretty_urls because it strips trailing slashes and fights
# Astro `trailingSlash: 'always'`, which caused ERR_TOO_MANY_REDIRECTS.

# Safe redirects only (no trailing-slash force rules)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services/web-design/"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/services/web-design/"
  status = 301

# Retired About page
[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/"
  status = 301

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/google8e22e4500e820b47.html"
  [headers.values]
    X-Robots-Tag = "noindex"
