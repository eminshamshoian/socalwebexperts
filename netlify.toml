[build]
  command = "pnpm build"
  publish = "dist"

# Do NOT enable pretty_urls — it strips trailing slashes and fights
# Astro `trailingSlash: 'always'`, which caused ERR_TOO_MANY_REDIRECTS.

# Safe redirects only (no trailing-slash force rules)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services/web-design/"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/services/web-design/"
  status = 301

# ── Headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/google8e22e4500e820b47.html"
  [headers.values]
    X-Robots-Tag = "noindex"
